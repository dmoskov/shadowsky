appId: com.shadowsky.mobile
env:
  TEST_HANDLE: ${MAESTRO_TEST_HANDLE}
  TEST_APP_PASSWORD: ${MAESTRO_TEST_APP_PASSWORD}
---
# E2E Test: Profile View
# Tests navigating to the user's profile and verifying profile elements.
# Requires MAESTRO_TEST_HANDLE and MAESTRO_TEST_APP_PASSWORD env vars.
#
# Run with:
#   MAESTRO_TEST_HANDLE=your.handle MAESTRO_TEST_APP_PASSWORD=xxxx-xxxx-xxxx-xxxx \
#     maestro test .maestro/profile_view.yaml

- launchApp
- waitForAnimationToEnd

# Sign in via App Password
- tapOn: "App Password"
- waitForAnimationToEnd
- tapOn:
    text: "yourhandle.bsky.social"
    index: 0
- inputText: "${TEST_HANDLE}"
- tapOn: "xxxx-xxxx-xxxx-xxxx"
- inputText: "${TEST_APP_PASSWORD}"
- tapOn: "Sign In"

# Wait for home feed to load
- extendedWaitUntil:
    visible: "Home tab"
    timeout: 30000

# Navigate to profile tab
- tapOn: "Profile tab"
- waitForAnimationToEnd

# Verify profile header elements
- assertVisible: "Posts"
- assertVisible: "Followers"
- assertVisible: "Following"

# Verify own-profile action buttons
- assertVisible: "Edit Profile"
- assertVisible: "Sign Out"

# Verify profile content tabs
- assertVisible: "Posts tab"

# Switch to Replies tab
- tapOn: "Replies tab"
- waitForAnimationToEnd

# Switch to Media tab
- tapOn: "Media tab"
- waitForAnimationToEnd

# Switch to Likes tab
- tapOn: "Likes tab"
- waitForAnimationToEnd

# Switch back to Posts tab
- tapOn: "Posts tab"
- waitForAnimationToEnd

# Navigate back to Home
- tapOn: "Home tab"
- waitForAnimationToEnd
- assertVisible: "Home tab"
