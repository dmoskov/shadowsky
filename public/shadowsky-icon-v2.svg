<!-- ShadowSky Icon — Butterfly Alighting on Asphodel -->
<!-- Petal curves: refined Beziers with geometric control points -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#161a2e"/>

  <g transform="translate(256,262) rotate(35)">

    <!-- Flower petals (white pair, drawn first = behind) -->
    <g transform="rotate(180)">
      <path d="M0,-30 C-46,-62 -52,-136 0,-180 C52,-136 46,-62 0,-30Z" fill="#e8e0d0"/>
    </g>
    <g transform="rotate(240)">
      <path d="M0,-30 C-46,-62 -52,-136 0,-180 C52,-136 46,-62 0,-30Z" fill="#e8e0d0"/>
    </g>

    <!-- Flower petals (pink pair, overlapping white) -->
    <g transform="rotate(278)">
      <path d="M0,-30 C-46,-62 -52,-136 0,-180 C52,-136 46,-62 0,-30Z" fill="#d8a0b8"/>
    </g>
    <g transform="rotate(142)">
      <path d="M0,-30 C-46,-62 -52,-136 0,-180 C52,-136 46,-62 0,-30Z" fill="#d8a0b8"/>
    </g>

    <!-- Butterfly wings (blue pair) -->
    <g transform="rotate(0)">
      <path d="M0,-30 C-46,-62 -52,-136 0,-180 C52,-136 46,-62 0,-30Z" fill="#5a9ec0"/>
    </g>
    <g transform="rotate(60)">
      <path d="M0,-30 C-46,-62 -52,-136 0,-180 C52,-136 46,-62 0,-30Z" fill="#8ec4e0"/>
    </g>

    <!-- Stem (between cream petals, extending away from butterfly) -->
    <g transform="rotate(210)">
      <path d="M0,-25 Q10,-120 -5,-200" stroke="#c0a898" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

  </g>
</svg>
