<!-- Asphodel App Icon -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="50%" stop-color="#16082a"/>
      <stop offset="100%" stop-color="#0f0520"/>
    </linearGradient>

    <!-- Primary wing gradient: pink to purple -->
    <linearGradient id="wingGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fb5"/>
      <stop offset="50%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="wingGradR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8fb5"/>
      <stop offset="50%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Lower wing gradient -->
    <linearGradient id="lowerGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="lowerGradR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="wingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#ff6b9d" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wing shimmer -->
    <radialGradient id="shimL" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shimR" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Subtle background glow -->
  <ellipse cx="256" cy="240" rx="140" ry="120" fill="#ff6b9d" opacity="0.06"/>
  <ellipse cx="256" cy="260" rx="100" ry="80" fill="#7c3aed" opacity="0.04"/>

  <!-- Upper left wing -->
  <path d="M 248 220
           C 218 150, 160 65, 98 46
           C 58 34, 32 56, 38 96
           C 44 148, 76 208, 132 244
           C 164 262, 210 254, 248 236
           Z"
        fill="url(#wingGradL)"
        filter="url(#wingGlow)"/>

  <!-- Upper right wing -->
  <path d="M 264 220
           C 294 150, 352 65, 414 46
           C 454 34, 480 56, 474 96
           C 468 148, 436 208, 380 244
           C 348 262, 302 254, 264 236
           Z"
        fill="url(#wingGradR)"
        filter="url(#wingGlow)"/>

  <!-- Lower left wing -->
  <path d="M 248 244
           C 206 266, 132 300, 92 368
           C 68 410, 80 446, 116 454
           C 160 460, 212 428, 238 376
           C 248 350, 248 290, 248 258
           Z"
        fill="url(#lowerGradL)"/>

  <!-- Lower right wing -->
  <path d="M 264 244
           C 306 266, 380 300, 420 368
           C 444 410, 432 446, 396 454
           C 352 460, 300 428, 274 376
           C 264 350, 264 290, 264 258
           Z"
        fill="url(#lowerGradR)"/>

  <!-- Wing shimmer overlays -->
  <path d="M 248 220
           C 218 150, 160 65, 98 46
           C 58 34, 32 56, 38 96
           C 44 148, 76 208, 132 244
           C 164 262, 210 254, 248 236
           Z"
        fill="url(#shimL)"/>
  <path d="M 264 220
           C 294 150, 352 65, 414 46
           C 454 34, 480 56, 474 96
           C 468 148, 436 208, 380 244
           C 348 262, 302 254, 264 236
           Z"
        fill="url(#shimR)"/>

  <!-- Wing vein details -->
  <path d="M 248 226 C 200 166, 140 90, 90 56" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.18"/>
  <path d="M 248 232 C 184 200, 108 152, 52 128" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.12"/>
  <path d="M 264 226 C 312 166, 372 90, 422 56" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.18"/>
  <path d="M 264 232 C 328 200, 404 152, 460 128" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.12"/>

  <!-- Body -->
  <ellipse cx="256" cy="252" rx="13" ry="72" fill="#1a0a2e"/>
  <ellipse cx="256" cy="252" rx="9" ry="68" fill="#2d1050"/>
  <ellipse cx="254" cy="240" rx="4" ry="30" fill="#ffffff" opacity="0.1"/>

  <!-- Head -->
  <circle cx="256" cy="176" r="16" fill="#1a0a2e"/>
  <circle cx="256" cy="176" r="12" fill="#2d1050"/>

  <!-- Eyes -->
  <circle cx="250" cy="174" r="3" fill="#ff6b9d"/>
  <circle cx="262" cy="174" r="3" fill="#ff6b9d"/>

  <!-- Antennae -->
  <path d="M 249 164 C 230 128, 210 108, 192 90" stroke="#2d1050" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M 263 164 C 282 128, 302 108, 320 90" stroke="#2d1050" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Antennae tips -->
  <circle cx="192" cy="90" r="8" fill="#ff6b9d"/>
  <circle cx="320" cy="90" r="8" fill="#ff6b9d"/>
  <circle cx="192" cy="90" r="4" fill="#ff8fb5"/>
  <circle cx="320" cy="90" r="4" fill="#ff8fb5"/>

  <!-- Wing spots -->
  <circle cx="142" cy="140" r="12" fill="#ffffff" opacity="0.12"/>
  <circle cx="370" cy="140" r="12" fill="#ffffff" opacity="0.12"/>
  <circle cx="116" cy="192" r="9" fill="#ffffff" opacity="0.1"/>
  <circle cx="396" cy="192" r="9" fill="#ffffff" opacity="0.1"/>
  <circle cx="136" cy="370" r="8" fill="#ffffff" opacity="0.08"/>
  <circle cx="376" cy="370" r="8" fill="#ffffff" opacity="0.08"/>
</svg>