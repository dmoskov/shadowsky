<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary wing gradient: pink to purple -->
    <linearGradient id="wingGradientL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fb5"/>
      <stop offset="50%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="wingGradientR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8fb5"/>
      <stop offset="50%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Lower wing gradient: deeper purple -->
    <linearGradient id="lowerWingL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="lowerWingR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ff6b9d" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner wing shimmer -->
    <radialGradient id="shimmerL" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shimmerR" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Upper left wing -->
  <path d="M 97 88
           C 85 60, 65 25, 38 18
           C 22 14, 12 22, 14 38
           C 16 58, 28 82, 50 96
           C 62 103, 80 100, 97 93
           Z"
        fill="url(#wingGradientL)"
        filter="url(#glow)"/>

  <!-- Upper right wing -->
  <path d="M 103 88
           C 115 60, 135 25, 162 18
           C 178 14, 188 22, 186 38
           C 184 58, 172 82, 150 96
           C 138 103, 120 100, 103 93
           Z"
        fill="url(#wingGradientR)"
        filter="url(#glow)"/>

  <!-- Lower left wing -->
  <path d="M 97 97
           C 80 105, 50 118, 35 145
           C 26 162, 30 175, 45 178
           C 62 180, 82 168, 93 148
           C 97 138, 97 115, 97 102
           Z"
        fill="url(#lowerWingL)"/>

  <!-- Lower right wing -->
  <path d="M 103 97
           C 120 105, 150 118, 165 145
           C 174 162, 170 175, 155 178
           C 138 180, 118 168, 107 148
           C 103 138, 103 115, 103 102
           Z"
        fill="url(#lowerWingR)"/>

  <!-- Wing shimmer overlays -->
  <path d="M 97 88
           C 85 60, 65 25, 38 18
           C 22 14, 12 22, 14 38
           C 16 58, 28 82, 50 96
           C 62 103, 80 100, 97 93
           Z"
        fill="url(#shimmerL)"/>
  <path d="M 103 88
           C 115 60, 135 25, 162 18
           C 178 14, 188 22, 186 38
           C 184 58, 172 82, 150 96
           C 138 103, 120 100, 103 93
           Z"
        fill="url(#shimmerR)"/>

  <!-- Wing vein details -->
  <path d="M 97 90 C 78 65, 55 35, 35 22" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.2"/>
  <path d="M 97 92 C 72 78, 42 60, 20 50" stroke="#ffffff" stroke-width="0.6" fill="none" opacity="0.15"/>
  <path d="M 97 94 C 75 88, 50 85, 30 80" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.12"/>

  <path d="M 103 90 C 122 65, 145 35, 165 22" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.2"/>
  <path d="M 103 92 C 128 78, 158 60, 180 50" stroke="#ffffff" stroke-width="0.6" fill="none" opacity="0.15"/>
  <path d="M 103 94 C 125 88, 150 85, 170 80" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.12"/>

  <!-- Body -->
  <ellipse cx="100" cy="100" rx="5" ry="28" fill="#2d1b4e"/>
  <ellipse cx="100" cy="100" rx="3.5" ry="26" fill="#3b1f6b"/>
  <!-- Body highlight -->
  <ellipse cx="99" cy="95" rx="1.5" ry="12" fill="#ffffff" opacity="0.15"/>

  <!-- Head -->
  <circle cx="100" cy="70" r="6" fill="#2d1b4e"/>
  <circle cx="100" cy="70" r="4.5" fill="#3b1f6b"/>

  <!-- Eyes -->
  <circle cx="97.5" cy="69" r="1.2" fill="#ff6b9d"/>
  <circle cx="102.5" cy="69" r="1.2" fill="#ff6b9d"/>

  <!-- Antennae -->
  <path d="M 97 65 C 90 50, 82 42, 75 35" stroke="#3b1f6b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 103 65 C 110 50, 118 42, 125 35" stroke="#3b1f6b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Antennae tips -->
  <circle cx="75" cy="35" r="3" fill="#ff6b9d"/>
  <circle cx="125" cy="35" r="3" fill="#ff6b9d"/>
  <circle cx="75" cy="35" r="1.5" fill="#ff8fb5"/>
  <circle cx="125" cy="35" r="1.5" fill="#ff8fb5"/>

  <!-- Decorative spots on wings -->
  <circle cx="55" cy="55" r="5" fill="#ffffff" opacity="0.15"/>
  <circle cx="145" cy="55" r="5" fill="#ffffff" opacity="0.15"/>
  <circle cx="45" cy="75" r="3.5" fill="#ffffff" opacity="0.12"/>
  <circle cx="155" cy="75" r="3.5" fill="#ffffff" opacity="0.12"/>
  <circle cx="52" cy="145" r="3" fill="#ffffff" opacity="0.1"/>
  <circle cx="148" cy="145" r="3" fill="#ffffff" opacity="0.1"/>
</svg>