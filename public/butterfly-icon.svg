<!-- Asphodel Flower Icon -->
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="512" height="512" rx="96" fill="#161a2e"/>

  <!-- Flower centered at 256,256 -->
  <g transform="translate(256,256)">

    <!-- 6 outer petals (hexagram) — each split into dark/light halves -->
    <polygon points="0,-178 -52,-108 0,-60" fill="#a89038"/>
    <polygon points="0,-178 52,-108 0,-60" fill="#d4b85a"/>

    <g transform="rotate(60)">
      <polygon points="0,-178 -52,-108 0,-60" fill="#a89038"/>
      <polygon points="0,-178 52,-108 0,-60" fill="#d4b85a"/>
    </g>
    <g transform="rotate(120)">
      <polygon points="0,-178 -52,-108 0,-60" fill="#a89038"/>
      <polygon points="0,-178 52,-108 0,-60" fill="#d4b85a"/>
    </g>
    <g transform="rotate(180)">
      <polygon points="0,-178 -52,-108 0,-60" fill="#a89038"/>
      <polygon points="0,-178 52,-108 0,-60" fill="#d4b85a"/>
    </g>
    <g transform="rotate(240)">
      <polygon points="0,-178 -52,-108 0,-60" fill="#a89038"/>
      <polygon points="0,-178 52,-108 0,-60" fill="#d4b85a"/>
    </g>
    <g transform="rotate(300)">
      <polygon points="0,-178 -52,-108 0,-60" fill="#a89038"/>
      <polygon points="0,-178 52,-108 0,-60" fill="#d4b85a"/>
    </g>

    <!-- 6 inner petals (between outer petals, 30° offset) -->
    <g transform="rotate(30)">
      <polygon points="0,-94 -18,-74 0,-58" fill="#a89038"/>
      <polygon points="0,-94 18,-74 0,-58" fill="#d4b85a"/>
    </g>
    <g transform="rotate(90)">
      <polygon points="0,-94 -18,-74 0,-58" fill="#a89038"/>
      <polygon points="0,-94 18,-74 0,-58" fill="#d4b85a"/>
    </g>
    <g transform="rotate(150)">
      <polygon points="0,-94 -18,-74 0,-58" fill="#a89038"/>
      <polygon points="0,-94 18,-74 0,-58" fill="#d4b85a"/>
    </g>
    <g transform="rotate(210)">
      <polygon points="0,-94 -18,-74 0,-58" fill="#a89038"/>
      <polygon points="0,-94 18,-74 0,-58" fill="#d4b85a"/>
    </g>
    <g transform="rotate(270)">
      <polygon points="0,-94 -18,-74 0,-58" fill="#a89038"/>
      <polygon points="0,-94 18,-74 0,-58" fill="#d4b85a"/>
    </g>
    <g transform="rotate(330)">
      <polygon points="0,-94 -18,-74 0,-58" fill="#a89038"/>
      <polygon points="0,-94 18,-74 0,-58" fill="#d4b85a"/>
    </g>

    <!-- 12 dots in a ring (between petal bases, 15° offset) -->
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(15)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(45)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(75)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(105)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(135)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(165)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(195)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(225)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(255)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(285)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(315)"/>
    <circle cx="0" cy="-78" r="5.5" fill="#ede0c0" transform="rotate(345)"/>

    <!-- Center ring -->
    <circle r="34" fill="#ede0c0"/>
    <circle r="21" fill="#9e8a38"/>
  </g>
</svg>
