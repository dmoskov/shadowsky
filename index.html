<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/butterfly-icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />

    <!-- Polyfill requestIdleCallback for Safari/iOS - must run before any other JS -->
    <script>
      if (!window.requestIdleCallback) {
        window.requestIdleCallback = function (cb, opts) {
          return setTimeout(function () {
            cb({
              didTimeout: true,
              timeRemaining: function () {
                return 0;
              },
            });
          }, 1);
        };
        window.cancelIdleCallback = function (id) {
          clearTimeout(id);
        };
      }
    </script>

    <!-- Critical CSS - inlined for faster First Contentful Paint -->
    <style>
      /* Critical theme variables for initial render */
      :root {
        --bsky-primary: #0085ff;
        --bsky-bg-primary: #0a0e1a;
        --bsky-bg-secondary: #111827;
        --bsky-text-primary: #f8fafc;
        --bsky-text-secondary: #94a3b8;
      }
      /* Base styles for loading screen */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bsky-bg-primary);
        color: var(--bsky-text-primary);
        min-height: 100vh;
      }
      /* Flex utilities for loading screen */
      .flex {
        display: flex;
      }
      .items-center {
        align-items: center;
      }
      .justify-center {
        justify-content: center;
      }
      .min-h-screen {
        min-height: 100vh;
      }
      /* Animation for loading spinner */
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin {
        animation: spin 1s linear infinite;
      }
    </style>

    <!-- Primary Meta Tags -->
    <title>ShadowSky - Bluesky Companion</title>
    <meta name="title" content="ShadowSky - Bluesky Companion" />
    <meta
      name="description"
      content="ShadowSky - Your companion app for deeper Bluesky insights"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shadowsky.io/" />
    <meta property="og:title" content="ShadowSky - Bluesky Companion" />
    <meta
      property="og:description"
      content="Your companion app for deeper Bluesky insights. Enhanced analytics, multi-column views, and powerful tools for the Bluesky community."
    />
    <meta
      property="og:image"
      content="https://shadowsky.io/butterfly-icon.svg"
    />
    <meta property="og:site_name" content="ShadowSky" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://shadowsky.io/" />
    <meta name="twitter:title" content="ShadowSky - Bluesky Companion" />
    <meta
      name="twitter:description"
      content="Your companion app for deeper Bluesky insights. Enhanced analytics, multi-column views, and powerful tools for the Bluesky community."
    />
    <meta
      name="twitter:image"
      content="https://shadowsky.io/butterfly-icon.svg"
    />
  </head>
  <body>
    <div id="root">
      <!-- Loading state while React initializes -->
      <div
        style="
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          background-color: #0a0e1a;
        "
      >
        <div style="text-align: center">
          <div
            style="
              width: 50px;
              height: 50px;
              border: 3px solid #1e293b;
              border-top-color: #0085ff;
              border-radius: 50%;
              animation: spin 1s linear infinite;
              margin: 0 auto;
            "
          ></div>
          <p
            style="
              color: #94a3b8;
              margin-top: 16px;
              font-family:
                system-ui,
                -apple-system,
                sans-serif;
            "
          >
            Loading ShadowSky...
          </p>
        </div>
      </div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
