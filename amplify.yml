version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - node --version
        # Install Bun with retry logic (GitHub can return 504 errors)
        - |
          if [ ! -f ~/.bun/bin/bun ]; then
            for i in 1 2 3; do
              echo "Attempting to install Bun (attempt $i/3)..."
              if curl -fsSL https://bun.sh/install | bash; then
                break
              fi
              if [ $i -lt 3 ]; then
                echo "Bun install failed, retrying in 5 seconds..."
                sleep 5
              else
                echo "Bun install failed after 3 attempts"
                exit 1
              fi
            done
          fi
        - export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH"
        - bun --version
        - bun install
    build:
      commands:
        - export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH"
        # Debug: Check if environment variables are available
        # CONFIGURATION NOTE:
        # To enable WebSockets (Sandbox): Set VITE_WS_URL environment variable in Amplify Console
        # To disable WebSockets (Production): Remove/Unset VITE_WS_URL environment variable in Amplify Console
        - echo "Checking for VITE_ environment variables:"
        - env | grep VITE_ || echo "No VITE_ variables found"
        - bun run build:ci
    postBuild:
      commands:
        # Create a 404.html that redirects to index.html for client-side routing
        - cp dist/index.html dist/404.html
        # Sync to S3 and invalidate CloudFront (prod branch only)
        - |
          if [ "$AWS_BRANCH" = "prod" ]; then
            echo "Syncing to S3..."
            aws s3 sync dist/ s3://shadowsky-frontend-181691141781/ --delete
            echo "Invalidating CloudFront caches..."
            aws cloudfront create-invalidation --distribution-id E23PU8CFBQFK81 --paths "/*" || echo "shadowsky invalidation failed"
            echo "Deploy to S3/CloudFront complete."
          else
            echo "Skipping S3 deploy (branch: $AWS_BRANCH)"
          fi
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      # Only cache Bun binary - download cache doesn't help
      - ~/.bun/bin/*
# Redirect and rewrite rules for SPA routing
redirects:
  # Core app routes
  - source: /home
    target: /index.html
    status: 200
  - source: /home/*
    target: /index.html
    status: 200
  - source: /timeline
    target: /index.html
    status: 200
  - source: /timeline/*
    target: /index.html
    status: 200
  - source: /notifications
    target: /index.html
    status: 200
  - source: /notifications/*
    target: /index.html
    status: 200
  - source: /analytics
    target: /index.html
    status: 200
  - source: /analytics/*
    target: /index.html
    status: 200
  - source: /search
    target: /index.html
    status: 200
  - source: /search/*
    target: /index.html
    status: 200
  - source: /bookmarks
    target: /index.html
    status: 200
  - source: /bookmarks/*
    target: /index.html
    status: 200
  - source: /conversations
    target: /index.html
    status: 200
  - source: /conversations/*
    target: /index.html
    status: 200
  - source: /messages
    target: /index.html
    status: 200
  - source: /messages/*
    target: /index.html
    status: 200
  - source: /compose
    target: /index.html
    status: 200
  - source: /compose/*
    target: /index.html
    status: 200

  # Dynamic routes
  - source: /profile/<*>
    target: /index.html
    status: 200
  - source: /thread/<*>
    target: /index.html
    status: 200

  # Settings routes
  - source: /settings
    target: /index.html
    status: 200
  - source: /settings/<*>
    target: /index.html
    status: 200

  # Debug routes
  - source: /compression-test
    target: /index.html
    status: 200

  # Catch-all fallback for any other routes
  - source: /<*>
    target: /index.html
    status: 200
customHeaders:
  - pattern: "**/*"
    headers:
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains"
