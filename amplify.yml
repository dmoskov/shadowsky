version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - node --version
        - npm ci
    build:
      commands:
        # Debug: Check if environment variables are available
        - echo "Checking for VITE_ environment variables:"
        - env | grep VITE_ || echo "No VITE_ variables found"
        - npm run build
    postBuild:
      commands:
        # Create a 404.html that redirects to index.html for client-side routing
        - cp dist/index.html dist/404.html
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
# Redirect and rewrite rules for SPA routing
redirects:
  # Remove trailing slashes (permanent redirect)
  - source: /<*>/
    target: /<*>
    status: 301

  # SPA fallback - serve index.html for all routes that don't match static files
  # The 404-200 status means: if the file doesn't exist (404), serve index.html with 200 status
  # This enables client-side routing to work on refresh
  - source: /<*>
    target: /index.html
    status: 404-200
customHeaders:
  - pattern: "**/*"
    headers:
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains"
