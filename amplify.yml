version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - node --version
        # Install Bun with retry logic (GitHub can return 504 errors)
        - |
          if [ ! -f ~/.bun/bin/bun ]; then
            for i in 1 2 3; do
              echo "Attempting to install Bun (attempt $i/3)..."
              if curl -fsSL https://bun.sh/install | bash; then
                break
              fi
              if [ $i -lt 3 ]; then
                echo "Bun install failed, retrying in 5 seconds..."
                sleep 5
              else
                echo "Bun install failed after 3 attempts"
                exit 1
              fi
            done
          fi
        - export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH"
        - bun --version
        - bun install
    build:
      commands:
        - export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH"
        # Debug: Check if environment variables are available
        # CONFIGURATION NOTE:
        # To enable WebSockets (Sandbox): Set VITE_WS_URL environment variable in Amplify Console
        # To disable WebSockets (Production): Remove/Unset VITE_WS_URL environment variable in Amplify Console
        - echo "Checking for VITE_ environment variables:"
        - env | grep VITE_ || echo "No VITE_ variables found"
        - bun run build:ci
    postBuild:
      commands:
        # Create a 404.html that redirects to index.html for client-side routing
        - cp dist/index.html dist/404.html
        # Sync to S3 and invalidate CloudFront (prod branch only)
        - |
          if [ "$AWS_BRANCH" = "prod" ]; then
            echo "Syncing to S3..."
            aws s3 sync dist/ s3://shadowsky-frontend-181691141781/ --delete
            echo "Invalidating CloudFront caches..."
            aws cloudfront create-invalidation --distribution-id E23PU8CFBQFK81 --paths "/*" || echo "shadowsky invalidation failed"
            echo "Deploy to S3/CloudFront complete."
          else
            echo "Skipping S3 deploy (branch: $AWS_BRANCH)"
          fi
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      # Only cache Bun binary - download cache doesn't help
      - ~/.bun/bin/*
# ──────────────────────────────────────────────────────────────────────
# ROUTING / REWRITE RULES
#
# Amplify does NOT read redirect/rewrite rules from this build spec.
# They are configured at the app level and managed via the AWS CLI:
#
#   # View current rules
#   aws amplify get-app --app-id d1g6mni4b6812x \
#     --query 'app.customRules'
#
#   # Update rules (JSON array)
#   aws amplify update-app --app-id d1g6mni4b6812x \
#     --custom-rules '[{"source":"</^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|jpeg|webmanifest|html)$)([^.]+$)/>","target":"/index.html","status":"200"}]'
#
# After updating, redeploy the branch to propagate the change.
#
# The single rule above is a regex catch-all that rewrites any path
# that does NOT end in a static-asset extension to /index.html (SPA
# routing). To allow a new extension through without rewriting, add
# it to the negative-lookahead list.
# ──────────────────────────────────────────────────────────────────────
customHeaders:
  - pattern: "**/*"
    headers:
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains"
