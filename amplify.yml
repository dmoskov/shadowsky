version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - node --version
        - npm ci
    build:
      commands:
        # Debug: Check if environment variables are available
        # CONFIGURATION NOTE:
        # To enable WebSockets (Sandbox): Set VITE_WS_URL environment variable in Amplify Console
        # To disable WebSockets (Production): Remove/Unset VITE_WS_URL environment variable in Amplify Console
        - echo "Checking for VITE_ environment variables:"
        - env | grep VITE_ || echo "No VITE_ variables found"
        - npm run build
    postBuild:
      commands:
        # Create a 404.html that redirects to index.html for client-side routing
        - cp dist/index.html dist/404.html
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
# Redirect and rewrite rules for SPA routing
redirects:
  # Core app routes
  - source: /home
    target: /index.html
    status: 200
  - source: /home/*
    target: /index.html
    status: 200
  - source: /timeline
    target: /index.html
    status: 200
  - source: /timeline/*
    target: /index.html
    status: 200
  - source: /notifications
    target: /index.html
    status: 200
  - source: /notifications/*
    target: /index.html
    status: 200
  - source: /analytics
    target: /index.html
    status: 200
  - source: /analytics/*
    target: /index.html
    status: 200
  - source: /search
    target: /index.html
    status: 200
  - source: /search/*
    target: /index.html
    status: 200
  - source: /bookmarks
    target: /index.html
    status: 200
  - source: /bookmarks/*
    target: /index.html
    status: 200
  - source: /conversations
    target: /index.html
    status: 200
  - source: /conversations/*
    target: /index.html
    status: 200
  - source: /messages
    target: /index.html
    status: 200
  - source: /messages/*
    target: /index.html
    status: 200
  - source: /compose
    target: /index.html
    status: 200
  - source: /compose/*
    target: /index.html
    status: 200

  # Dynamic routes
  - source: /profile/<*>
    target: /index.html
    status: 200
  - source: /thread/<*>
    target: /index.html
    status: 200

  # Settings routes
  - source: /settings
    target: /index.html
    status: 200
  - source: /settings/<*>
    target: /index.html
    status: 200

  # Debug routes
  - source: /compression-test
    target: /index.html
    status: 200

  # Catch-all fallback for any other routes
  - source: /<*>
    target: /index.html
    status: 200
customHeaders:
  - pattern: "**/*"
    headers:
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains"
