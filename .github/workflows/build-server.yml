name: Build Server (PR Check)

# Build-only check for PRs. Actual deployment happens in deploy-server.yml.
on:
  pull_request:
    branches:
      - main
    paths:
      - "server/**"

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test Server Image

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image
        run: |
          cd server
          docker build --platform linux/amd64 -t shadowsky-api-server:test .
          echo "✅ Server image built successfully"

      - name: Test image can start
        run: |
          docker run --rm -d --name shadowsky-test -p 3002:3002 -p 3001:3001 shadowsky-api-server:test
          sleep 5
          docker logs shadowsky-test
          curl -sf http://localhost:3002/health || (docker logs shadowsky-test && exit 1)
          docker stop shadowsky-test
          echo "✅ Server image starts successfully"
