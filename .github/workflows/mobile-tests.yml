name: Mobile Tests

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-tests.yml"
  push:
    branches:
      - main
      - "task/*"
    paths:
      - "mobile/**"

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Run lint
        working-directory: mobile
        run: npm run lint || true

      - name: Run type check
        working-directory: mobile
        run: npm run build

      - name: Run tests
        working-directory: mobile
        run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=json --coverageReporters=lcov --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: mobile/coverage/coverage-final.json
          flags: mobile
          name: mobile-coverage
        if: always()

      - name: Comment PR with coverage
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: mobile/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'

  e2e-tests:
    name: E2E Tests (Maestro)
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "${HOME}/.maestro/bin" >> $GITHUB_PATH

      - name: Setup iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15 Pro" || true
          xcrun simctl list

      - name: Start Expo
        working-directory: mobile
        run: |
          npm start &
          sleep 30

      - name: Check for connected devices
        id: check-devices
        run: |
          DEVICE_COUNT=$(xcrun simctl list devices booted 2>/dev/null | grep -c "Booted" || echo "0")
          echo "device_count=$DEVICE_COUNT" >> $GITHUB_OUTPUT
          if [ "$DEVICE_COUNT" -eq "0" ]; then
            echo "⚠️ No booted simulators found — skipping Maestro tests"
          fi

      - name: Run Maestro E2E tests (unauthenticated)
        if: steps.check-devices.outputs.device_count != '0'
        working-directory: mobile
        run: |
          maestro test .maestro/app_launch.yaml --format junit --output e2e-results-launch.xml
          maestro test .maestro/auth_mode_switch.yaml --format junit --output e2e-results-auth-mode.xml
          maestro test .maestro/auth_input_validation.yaml --format junit --output e2e-results-auth-input.xml
        timeout-minutes: 15

      - name: Run Maestro E2E tests (authenticated)
        if: steps.check-devices.outputs.device_count != '0' && env.MAESTRO_TEST_HANDLE != ''
        working-directory: mobile
        env:
          MAESTRO_TEST_HANDLE: ${{ secrets.MAESTRO_TEST_HANDLE }}
          MAESTRO_TEST_APP_PASSWORD: ${{ secrets.MAESTRO_TEST_APP_PASSWORD }}
        run: |
          maestro test .maestro/feed_scroll.yaml --format junit --output e2e-results-feed.xml
          maestro test .maestro/profile_view.yaml --format junit --output e2e-results-profile.xml
          maestro test .maestro/tab_navigation.yaml --format junit --output e2e-results-tabs.xml
        timeout-minutes: 15

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: mobile/e2e-results-*.xml
        if: always() && steps.check-devices.outputs.device_count != '0'

      - name: Publish E2E test report
        uses: dorny/test-reporter@v1
        if: always() && steps.check-devices.outputs.device_count != '0'
        with:
          name: E2E Tests
          path: mobile/e2e-results-*.xml
          reporter: java-junit

  swift-ui-tests:
    name: SwiftUI Interaction Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install Pods
        working-directory: mobile/ios
        run: pod install

      - name: Run SwiftUI tests
        working-directory: mobile/ios
        run: |
          xcodebuild test \
            -workspace Asphodel.xcworkspace \
            -scheme AsphodelUITests \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:AsphodelUITests \
            -resultBundlePath TestResults.xcresult \
            | xcpretty || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: swiftui-test-results
          path: mobile/ios/TestResults.xcresult
        if: always()

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Verify build
        working-directory: mobile
        run: npm run build

      - name: Check for TypeScript errors
        working-directory: mobile
        run: npx tsc --noEmit
