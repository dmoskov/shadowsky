name: Mobile Tests

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-tests.yml"
  push:
    branches:
      - main
      - "task/*"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-tests.yml"

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Run lint
        working-directory: mobile
        run: npm run lint

      - name: Run type check
        working-directory: mobile
        run: npm run build

      - name: Run tests
        working-directory: mobile
        run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=json --coverageReporters=lcov --maxWorkers=2

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: mobile/coverage/coverage-final.json
          flags: mobile
          name: mobile-coverage
        if: always()

      - name: Comment PR with coverage
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: mobile/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'pull_request'

  e2e-tests:
    name: E2E Tests (Maestro)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MAESTRO_TEST_HANDLE: ${{ secrets.MAESTRO_TEST_HANDLE }}
      MAESTRO_TEST_APP_PASSWORD: ${{ secrets.MAESTRO_TEST_APP_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install Pods
        working-directory: mobile/ios
        run: pod install

      - name: Detect available simulator
        id: sim
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['name'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"
          echo "Using simulator: $SIMULATOR"

      - name: Build app for simulator (Release, self-contained JS bundle)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Asphodel.xcworkspace \
            -scheme Asphodel \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Boot simulator
        run: |
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b

      - name: Install app on simulator
        working-directory: mobile/ios
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "Installing $APP_PATH"
          test -n "$APP_PATH"
          xcrun simctl install "$SIMULATOR" "$APP_PATH"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "${HOME}/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro E2E tests (unauthenticated)
        working-directory: mobile
        run: |
          maestro test .maestro/app_launch.yaml --format junit --output e2e-results-launch.xml
          maestro test .maestro/auth_mode_switch.yaml --format junit --output e2e-results-auth-mode.xml
          maestro test .maestro/auth_input_validation.yaml --format junit --output e2e-results-auth-input.xml
        timeout-minutes: 15

      - name: Run Maestro E2E tests (authenticated)
        if: env.MAESTRO_TEST_HANDLE != ''
        working-directory: mobile
        run: |
          maestro test .maestro/feed_scroll.yaml --format junit --output e2e-results-feed.xml
          maestro test .maestro/profile_view.yaml --format junit --output e2e-results-profile.xml
          maestro test .maestro/tab_navigation.yaml --format junit --output e2e-results-tabs.xml
        timeout-minutes: 15

      - name: Upload E2E test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-test-results
          path: mobile/e2e-results-*.xml

      - name: Upload Maestro debug output
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maestro-debug
          path: ~/.maestro/tests

  swift-ui-tests:
    name: SwiftUI Interaction Tests
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install Pods
        working-directory: mobile/ios
        run: pod install

      - name: Detect available simulator
        id: sim
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['name'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "SIMULATOR=$SIMULATOR" >> "$GITHUB_ENV"
          echo "Using simulator: $SIMULATOR"

      - name: Run SwiftUI tests
        working-directory: mobile/ios
        run: |
          xcodebuild test \
            -workspace Asphodel.xcworkspace \
            -scheme AsphodelUITests \
            -destination "platform=iOS Simulator,name=$SIMULATOR,OS=latest" \
            -only-testing:AsphodelUITests \
            -resultBundlePath TestResults.xcresult \
            | xcpretty || true

      - name: Upload test results
        uses: actions/upload-artifact@v6
        with:
          name: swiftui-test-results
          path: mobile/ios/TestResults.xcresult
        if: always()

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Verify build
        working-directory: mobile
        run: npm run build

      - name: Check for TypeScript errors
        working-directory: mobile
        run: npx tsc --noEmit

  bundle-size:
    name: Bundle Size Budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Export iOS bundle
        working-directory: mobile
        run: npx expo export --platform ios --no-bytecode --output-dir .bundle-export

      - name: Check bundle size budgets
        working-directory: mobile
        run: node scripts/check-bundle-size.js --output-dir .bundle-export --github-summary --pr-comment

      - name: Comment PR with bundle size
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mobile-bundle-size
          path: mobile/bundle-size-comment.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload bundle export
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobile-bundle-export
          path: mobile/.bundle-export/_expo/static/js/
          retention-days: 14
