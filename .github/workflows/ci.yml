name: CI
on:
  push:
    branches:
      - main
      - "task/*"
    paths-ignore:
      - "mobile/**"
      - "server/**"
      - ".github/workflows/mobile-tests.yml"
      - ".github/workflows/build-server.yml"
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "mobile/**"
      - "server/**"
      - ".github/workflows/mobile-tests.yml"
      - ".github/workflows/build-server.yml"
      - "**.md"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: google/wireit@setup-github-actions-caching/v2
      - run: npm ci
      - name: Check @atproto/api version lockstep (web/mobile/core)
        run: node scripts/check-atproto-version.mjs
      - run: npm test
      - name: Install Amplify function deps
        working-directory: amplify
        # npm install (not ci): the amplify lockfile is intentionally not kept
        # in strict sync, and these deps are only needed to run the function tests.
        # Retry up to 3 times to handle transient network errors (ECONNRESET).
        run: |
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            echo "::warning::npm install attempt $attempt failed, retrying..."
            sleep 5
          done
          echo "::error::npm install failed after 3 attempts"
          exit 1
      - name: Run Amplify function tests
        run: npm run test:amplify
      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage
      - name: Generate coverage summary
        if: always()
        run: |
          echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Thresholds (enforced by vitest.config.ts)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Threshold |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Statements | 10% |" >> $GITHUB_STEP_SUMMARY
          echo "| Branches | 10% |" >> $GITHUB_STEP_SUMMARY
          echo "| Functions | 10% |" >> $GITHUB_STEP_SUMMARY
          echo "| Lines | 10% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Baseline ~11% (UI-heavy app, primary coverage via E2E). Raise the thresholds in vitest.config.ts and update this table as unit coverage grows._" >> $GITHUB_STEP_SUMMARY
          echo "See coverage report artifact for detailed breakdown." >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  bundle-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build with bundle analysis
        run: ANALYZE=true npm run build:ci
      - name: Check bundle sizes
        run: |
          # Extract and display chunk sizes from build output
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Chunk | Size (gzip) |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------------|" >> $GITHUB_STEP_SUMMARY

          # List all JS chunks and their sizes
          for file in dist/assets/*.js; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              gzip_size=$(gzip -c "$file" | wc -c | awk '{printf "%.2f KB", $1/1024}')
              echo "| $filename | $gzip_size |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Bundle visualization: See artifacts for bundle-stats.html" >> $GITHUB_STEP_SUMMARY
      - name: Check size budgets
        run: |
          # Define size budgets (in bytes, gzipped)
          # Note: These are realistic budgets for a modern React SPA with AT Protocol integration
          MAX_MAIN_BUNDLE=500000  # 500KB gzipped for main entry chunk (~1.4MB uncompressed)
          MAX_VENDOR_CHUNK=300000 # 300KB gzipped for vendor chunks

          EXIT_CODE=0

          for file in dist/assets/*.js; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              gzip_size=$(gzip -c "$file" | wc -c)

              # Check main bundle (index-*.js)
              if [[ "$filename" == index-*.js ]]; then
                if [ "$gzip_size" -gt "$MAX_MAIN_BUNDLE" ]; then
                  gzip_kb=$(awk "BEGIN {printf \"%.2f\", $gzip_size/1024}")
                  limit_kb=$(awk "BEGIN {printf \"%.2f\", $MAX_MAIN_BUNDLE/1024}")
                  echo "::error::Main bundle $filename exceeds budget: ${gzip_kb}KB > ${limit_kb}KB"
                  EXIT_CODE=1
                fi
              fi

              # Check vendor chunks
              if [[ "$filename" == vendor-*.js ]]; then
                if [ "$gzip_size" -gt "$MAX_VENDOR_CHUNK" ]; then
                  gzip_kb=$(awk "BEGIN {printf \"%.2f\", $gzip_size/1024}")
                  limit_kb=$(awk "BEGIN {printf \"%.2f\", $MAX_VENDOR_CHUNK/1024}")
                  echo "::warning::Vendor chunk $filename exceeds budget: ${gzip_kb}KB > ${limit_kb}KB"
                fi
              fi
            fi
          done

          exit $EXIT_CODE
      - name: Upload bundle stats
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bundle-stats
          path: bundle-stats.html
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Accessibility Tests
        run: npm run test:a11y
        continue-on-error: false
      - name: Generate Accessibility Summary
        if: always()
        run: |
          echo "## Accessibility Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f accessibility-report.json ]; then
            echo "### axe-core WCAG 2.1 AA Compliance Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Parse and display results
            node -e "
              const report = require('./accessibility-report.json');
              const violations = report.violations || [];
              const passes = report.passes || [];
              const incomplete = report.incomplete || [];

              console.log('| Metric | Count |');
              console.log('|--------|-------|');
              console.log('| Passing Rules | ' + passes.length + ' |');
              console.log('| Violations | ' + violations.length + ' |');
              console.log('| Needs Review | ' + incomplete.length + ' |');

              if (violations.length > 0) {
                console.log('');
                console.log('### Violations by Impact');
                console.log('');
                const byImpact = violations.reduce((acc, v) => {
                  acc[v.impact] = (acc[v.impact] || 0) + 1;
                  return acc;
                }, {});
                console.log('| Impact | Count |');
                console.log('|--------|-------|');
                Object.entries(byImpact).forEach(([impact, count]) => {
                  console.log('| ' + impact + ' | ' + count + ' |');
                });

                console.log('');
                console.log('### Violation Details');
                console.log('');
                violations.slice(0, 10).forEach((v, i) => {
                  console.log('**' + (i+1) + '. ' + v.id + '** (' + v.impact + ')');
                  console.log('- ' + v.help);
                  console.log('- [More info](' + v.helpUrl + ')');
                  console.log('');
                });
                if (violations.length > 10) {
                  console.log('*...and ' + (violations.length - 10) + ' more violations. See full report.*');
                }
              }
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No detailed report available" >> $GITHUB_STEP_SUMMARY
          else
            echo "Accessibility tests completed. See Playwright report for details." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Accessibility Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: accessibility-report
          path: |
            accessibility-report.json
            playwright-report/
          retention-days: 30

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run Performance Tests (INP Budget)
        run: npm run test:perf
        env:
          PERFORMANCE_TEST: "true"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:5174"
      - name: Generate Performance Summary
        if: always()
        run: |
          echo "## Interaction Timing (INP) Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### INP Budget: 200ms" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tests verify that key user interactions complete within the 200ms INP budget." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Interaction | Budget |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Button clicks | < 200ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Form input focus | < 200ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Tab navigation | < 200ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Login toggle | < 200ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Link hover | < 200ms |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See Playwright report for detailed timing results." >> $GITHUB_STEP_SUMMARY
      - name: Upload Performance Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: performance-report
          path: playwright-report/
          retention-days: 30
      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: performance-test-results
          path: test-results/
          retention-days: 30

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build:ci
      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
      - name: Generate Lighthouse Summary
        if: always()
        run: |
          echo "## Lighthouse Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Core Web Vitals Thresholds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| LCP (Largest Contentful Paint) | < 2.5s | Required |" >> $GITHUB_STEP_SUMMARY
          echo "| INP (via TBT proxy) | < 200ms | Required |" >> $GITHUB_STEP_SUMMARY
          echo "| CLS (Cumulative Layout Shift) | < 0.1 | Required |" >> $GITHUB_STEP_SUMMARY
          echo "| FCP (First Contentful Paint) | < 1.8s | Required |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See Lighthouse report artifact for detailed results." >> $GITHUB_STEP_SUMMARY
      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30
