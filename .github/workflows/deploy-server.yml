name: Deploy API Server

# Runs automatically when server/ files change on main,
# or can be triggered manually via workflow_dispatch.
on:
  push:
    branches:
      - main
    paths:
      - "server/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-west-1
  AWS_ACCOUNT_ID: "181691141781"
  ECR_REPO: shadowsky/api-server
  ECS_CLUSTER: shadowsky-cluster
  ECS_SERVICE: shadowsky-api-server
  ECS_TASK_FAMILY: shadowsky-api-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build, Push, and Deploy API Server

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register new ECS task definition
        id: task-def
        run: |
          # Get the current task definition and update the image
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition $ECS_TASK_FAMILY \
            --query 'taskDefinition' \
            --output json)

          NEW_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:${GITHUB_SHA}"

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy)')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task-definition-arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "✅ Registered task definition: $NEW_ARN"

      - name: Create or update ECS service
        run: |
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'failures[0].reason' \
            --output text 2>/dev/null)

          if [ "$SERVICE_STATUS" = "MISSING" ]; then
            echo "⚠️ ECS service does not exist — creating it..."

            # Find subnets and security group
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters Name=isDefault,Values=true \
              --query 'Vpcs[0].VpcId' --output text)

            SUBNETS=$(aws ec2 describe-subnets \
              --filters Name=vpc-id,Values=$VPC_ID \
              --query 'Subnets[?MapPublicIpOnLaunch==`true`].SubnetId' \
              --output text | tr '\t' ',')

            # Use existing SG or create one
            SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=group-name,Values=shadowsky-api-sg Name=vpc-id,Values=$VPC_ID \
              --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null)

            if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
              SG_ID=$(aws ec2 create-security-group \
                --group-name shadowsky-api-sg \
                --description "ShadowSky API Server - ports 3001/3002" \
                --vpc-id $VPC_ID \
                --query 'GroupId' --output text)

              aws ec2 authorize-security-group-ingress --group-id $SG_ID \
                --ip-permissions \
                  IpProtocol=tcp,FromPort=3002,ToPort=3002,IpRanges='[{CidrIp=0.0.0.0/0}]' \
                  IpProtocol=tcp,FromPort=3001,ToPort=3001,IpRanges='[{CidrIp=0.0.0.0/0}]'
              echo "Created security group: $SG_ID"
            fi

            aws ecs create-service \
              --cluster $ECS_CLUSTER \
              --service-name $ECS_SERVICE \
              --task-definition "${{ steps.task-def.outputs.task-definition-arn }}" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration \
                "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG_ID],assignPublicIp=ENABLED}" \
              --query 'service.serviceName' --output text

            echo "✅ ECS service created"
          else
            # Service exists — update it
            aws ecs update-service \
              --cluster $ECS_CLUSTER \
              --service $ECS_SERVICE \
              --task-definition "${{ steps.task-def.outputs.task-definition-arn }}" \
              --force-new-deployment \
              --query 'service.deployments[0].status' --output text

            echo "✅ ECS deployment triggered"
          fi

      - name: Wait for deployment
        run: |
          echo "Waiting for ECS deployment to stabilize..."
          timeout 300 aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE || echo "⚠️ Timed out waiting — check console"

          RUNNING=$(aws ecs describe-services \
            --cluster $ECS_CLUSTER --services $ECS_SERVICE \
            --query 'services[0].runningCount' --output text)
          echo "Running tasks: $RUNNING"

      - name: Smoke test
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" https://api.shadowsky.io/health)
            if [ "$HTTP" = "200" ]; then
              echo "✅ Health check passed"

              # Verify a key AI route is reachable (401 = auth required = route exists)
              AI_HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                "https://api.shadowsky.io/api/v1/thread-summary" \
                -H "Content-Type: application/json" -d '{}')
              echo "  /api/v1/thread-summary → HTTP $AI_HTTP"

              if [ "$AI_HTTP" = "401" ] || [ "$AI_HTTP" = "400" ]; then
                echo "✅ API versioned routes working"
                exit 0
              else
                echo "⚠️ Versioned route returned $AI_HTTP (expected 401). DNS may still point to old server."
                exit 0  # Don't fail — DNS migration is a separate step
              fi
            fi
            echo "⏳ Attempt $i: HTTP $HTTP — retrying in 15s..."
            sleep 15
          done
          echo "❌ Health check failed after 5 attempts"
          exit 1
