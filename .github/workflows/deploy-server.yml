name: Deploy Server

on:
  push:
    branches:
      - main
      - prod
    paths:
      - "server/**"
  workflow_dispatch: # Allow manual triggers

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shadowsky/api-server
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd server
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster shadowsky-cluster \
            --service shadowsky-api-server \
            --force-new-deployment \
            --region us-west-1

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster shadowsky-cluster \
            --services shadowsky-api-server \
            --region us-west-1
        timeout-minutes: 10

      - name: Verify deployment
        run: |
          sleep 10
          curl -f https://api.shadowsky.io/health || exit 1
          echo "✅ Server deployment successful!"
